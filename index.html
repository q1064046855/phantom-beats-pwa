<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<!-- v3.42 iPhone 全屏关键：从桌面图标启动时进入 standalone 无浏览器外壳模式；
     缺这两个 meta，添加到主屏幕也仍带 Safari 地址栏 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<!-- 状态栏透明、页面铺满（刘海区由 CSS env(safe-area-inset-*) 避让，样式里已用） -->
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<!-- 桌面图标下显示的名称 -->
<meta name="apple-mobile-web-app-title" content="幻彩律动">
<title>幻彩律动 · PHANTOM BEATS</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;-webkit-user-select:none;user-select:none}
  canvas{position:fixed;inset:0;width:100vw;height:100vh;display:block;touch-action:none}

  #ui{
    position:fixed;top:calc(20px + env(safe-area-inset-top, 0px));right:calc(20px + env(safe-area-inset-right, 0px));
    background:rgba(8,8,14,0.72);
    border:1px solid rgba(255,255,255,0.10);
    border-radius:14px;
    backdrop-filter:blur(14px) saturate(160%);
    -webkit-backdrop-filter:blur(14px) saturate(160%);
    padding:12px 14px;
    width:auto;
    display:flex;align-items:center;gap:12px;
    /* 左侧给左上角歌名预留 ~260px，按钮排不下时换行，绝不遮挡歌名 */
    max-width:calc(100vw - 40px - 260px);
    max-height:calc(100vh - 40px);
    overflow:visible;
    transition:opacity .25s, transform .25s;
    z-index:10;
    box-shadow:0 12px 36px rgba(0,0,0,.5);
  }
  #ui:not(.pinned){opacity:0;transform:translateY(20px);pointer-events:none}
  #ui.pinned{opacity:1}
  #ui .row{display:flex;align-items:center;flex-wrap:wrap;gap:10px;padding:6px 0}
  #ui .row + .row{border-top:0}
  #ui .lab{font-size:11px;color:rgba(255,255,255,.55);letter-spacing:.1em;min-width:72px}

  .shape-badge{
    display:inline-flex;align-items:center;gap:6px;
    background:rgba(120,200,255,.18);
    border:1px solid rgba(120,200,255,.55);
    color:#fff;
    padding:5px 12px;border-radius:14px;
    font-size:12.5px;letter-spacing:.04em;
    box-shadow:0 0 10px rgba(120,200,255,.3);
  }
  .shape-badge::before{
    content:"";width:6px;height:6px;border-radius:50%;
    background:#7ec8ff;
    box-shadow:0 0 6px rgba(120,200,255,.8);
  }

  #ui select{
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.16);
    color:#fff;
    padding:5px 10px;border-radius:8px;font-size:12px;cursor:pointer;
    outline:none;
  }
  #ui select:focus{border-color:rgba(120,200,255,.7)}
  /* Windows/Chrome 原生下拉的 option 默认白底白字 → 强制深色底 */
  #ui select option{background:#171a2b;color:#eef2ff}
  #ui select option:checked{background:#2b6cff;color:#fff}

  .seg{display:inline-flex;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.10);border-radius:8px;overflow:hidden}
  .seg-btn{
    background:transparent;border:0;color:rgba(255,255,255,.6);
    padding:5px 12px;font-size:12px;cursor:pointer;
  }
  .seg-btn.active{background:rgba(120,200,255,.25);color:#fff}

  input[type=range]{
    -webkit-appearance:none;appearance:none;
    width:140px;height:4px;background:rgba(255,255,255,.15);
    border-radius:2px;outline:none;cursor:pointer;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;
    width:14px;height:14px;border-radius:50%;
    background:#7ec8ff;cursor:pointer;
    box-shadow:0 0 8px rgba(120,200,255,.6);
  }
  input[type=range]::-moz-range-thumb{
    width:14px;height:14px;border-radius:50%;background:#7ec8ff;border:0;cursor:pointer;
  }
  .v{font-size:11px;color:rgba(255,255,255,.7);min-width:36px;text-align:right;font-variant-numeric:tabular-nums}

  #hint{
    position:fixed;left:50%;top:18%;transform:translateX(-50%);
    font-size:14px;color:rgba(255,255,255,.85);
    background:rgba(0,0,0,.4);padding:10px 18px;border-radius:22px;
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    z-index:5;transition:opacity .6s;pointer-events:none;
  }
  #hint.hide{opacity:0}

  #status{
    position:fixed;left:20px;top:58px;
    font-size:12px;color:rgba(180,220,255,.85);
    background:rgba(0,0,0,.35);padding:6px 12px;border-radius:18px;
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    z-index:6;pointer-events:none;
    transition:opacity .3s;
  }
  #status:empty{display:none}

  .btn{
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.16);
    color:#fff;padding:6px 14px;border-radius:8px;
    font-size:12px;cursor:pointer;
  }
  .btn:hover{background:rgba(255,255,255,.12)}
  .btn.active{background:rgba(120,200,255,.28);color:#fff;border-color:rgba(120,200,255,.6)}

  /* 识别歌曲按钮：内嵌读条（仅识别中=灰色填充；v3.38 等待期绿色填充已按用户要求取消） */
  #recogBtn{position:relative;overflow:hidden;isolation:isolate}
  #recogBtn .recog-fill{
    position:absolute;left:0;top:0;bottom:0;width:0%;
    background:rgba(160,160,170,.55);   /* 识别中读条=灰色 */
    z-index:-1;
  }
  #recogBtn.busy{
    background:rgba(120,120,130,.30);  /* 灰色按钮 */
    border-color:rgba(170,170,180,.55);
    color:rgba(255,255,255,.85);cursor:wait;
  }
  #recogBtn .recog-label{position:relative;z-index:1;white-space:nowrap}
  /* v3.46e 紫色音符（强制文本字形，CSS 着色，与电脑端一致） */
  .recog-note{color:#b07bff;font-weight:900;font-size:1.15em;letter-spacing:0}

  /* 歌词同步控件 */
  .subs-sync-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .subs-sync-row input[type=text]{
    background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.16);
    color:#fff;padding:5px 10px;border-radius:8px;font-size:12px;
    width:140px;outline:none;
  }
  .subs-sync-row input[type=text]:focus{border-color:rgba(120,200,255,.7)}

  /* 历史：并入搜索框，点击搜索框弹出，仅歌名 */
  .search-wrap{position:relative;display:inline-flex}
  #historyPanel{
    display:none;position:fixed;z-index:9998;   /* v3.41: fixed（位置由 JS 按搜索框摆放），避免被窄屏横向滚动条裁剪 */
    min-width:220px;max-width:300px;max-height:320px;overflow-y:auto;
    background:rgba(18,20,36,.98);border:1px solid rgba(120,200,255,.28);
    border-radius:10px;box-shadow:0 12px 44px rgba(0,0,0,.65);padding:5px;
  }
  #historyPanel.show{display:block}
  .hist-item{
    padding:7px 10px;border-radius:7px;font-size:12px;color:#e4eaff;cursor:pointer;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .hist-item:hover{background:rgba(120,200,255,.18)}
  .hist-empty{padding:14px 10px;font-size:12px;color:#889;text-align:center}

  /* 左上角当前播放歌名 */
  #nowPlaying{
    position:fixed;left:20px;top:18px;z-index:7;
    display:none;align-items:center;gap:8px;
    max-width:250px;
    background:rgba(8,8,14,.62);border:1px solid rgba(255,255,255,.12);
    border-radius:16px;padding:7px 15px;
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    font-size:14px;font-weight:600;color:#fff;letter-spacing:.02em;
    box-shadow:0 8px 26px rgba(0,0,0,.4);
  }
  #nowPlaying.show{display:inline-flex}
  #nowPlaying .np-dot{
    width:7px;height:7px;border-radius:50%;flex-shrink:0;
    background:#38f0a8;box-shadow:0 0 8px rgba(56,240,168,.9);
  }
  #nowPlaying .np-title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* 左上角：自动识别倒计时读秒（歌放完后的 grace 等待期显示） */
  #autoLockChip{
    position:fixed;left:20px;top:56px;z-index:7;
    display:none;align-items:center;gap:8px;
    background:rgba(8,8,14,.62);border:1px solid rgba(255,190,80,.4);
    border-radius:16px;padding:6px 15px;
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    font-size:13px;font-weight:600;color:#ffd27d;letter-spacing:.02em;
    box-shadow:0 8px 26px rgba(0,0,0,.4);
  }
  #autoLockChip.show{display:inline-flex}
  #autoLockChip .alc-dot{
    width:7px;height:7px;border-radius:50%;flex-shrink:0;
    background:#ffbe4d;box-shadow:0 0 8px rgba(255,190,77,.9);
    animation:alcPulse 1s infinite alternate;
  }
  @keyframes alcPulse{from{opacity:.35}to{opacity:1}}

  /* 设置三级面板 */
  #settingsPanel{
    position:fixed;top:calc(78px + env(safe-area-inset-top,0px));right:calc(20px + env(safe-area-inset-right,0px));
    z-index:12;display:none;
    width:min(360px,calc(100vw - 40px));max-height:calc(100vh - 100px);overflow-y:auto;
    background:rgba(10,11,20,.86);border:1px solid rgba(255,255,255,.12);
    border-radius:14px;backdrop-filter:blur(16px) saturate(150%);
    -webkit-backdrop-filter:blur(16px) saturate(150%);
    box-shadow:0 16px 50px rgba(0,0,0,.6);
  }
  #settingsPanel.show{display:block}
  .set-header{
    display:flex;align-items:center;justify-content:space-between;
    position:sticky;top:0;z-index:2;
    padding:12px 16px;background:rgba(10,11,20,.92);
    border-bottom:1px solid rgba(255,255,255,.1);font-size:13px;color:#cdd8ff;
  }
  #settingsPanel .row{padding:9px 14px}
  #settingsPanel .row + .row{border-top:1px dashed rgba(255,255,255,.08)}
  #settingsPanel .lab{font-size:11px;color:rgba(255,255,255,.55);letter-spacing:.1em;min-width:72px}

  #fileInput{display:none}

  #showBtn{
    position:fixed;top:calc(20px + env(safe-area-inset-top, 0px));right:calc(20px + env(safe-area-inset-right, 0px));z-index:11;
    display:none;
  }
  #showBtn.show{display:block;}

  /* 右侧歌词全列表面板 */
  #lyricsAllPanel{
    position:fixed;top:20px;right:320px;bottom:20px;z-index:25;
    width:280px;display:none;flex-direction:column;
    background:rgba(0,0,0,.72);border:1px solid rgba(120,200,255,.2);
    border-radius:14px;overflow:hidden;
  }
  #lyricsAllPanel.show{display:flex;}
  .lyrics-all-header{
    display:flex;align-items:center;justify-content:space-between;
    padding:10px 14px;background:rgba(0,0,0,.4);
    border-bottom:1px solid rgba(120,200,255,.15);
    color:#8ee;font-size:13px;flex-shrink:0;
  }
  #lyricsAllList{
    flex:1;overflow-y:auto;padding:8px 0;
    -webkit-overflow-scrolling:touch;
  }
  #lyricsAllList::-webkit-scrollbar{width:4px}
  #lyricsAllList::-webkit-scrollbar-thumb{background:rgba(120,200,255,.3);border-radius:2px}
  .lyric-all-item{
    display:flex;align-items:baseline;gap:8px;
    padding:5px 14px;cursor:pointer;font-size:13px;
    color:rgba(255,255,255,.45);transition:color .12s,background .12s;
    border-radius:6px;margin:1px 6px;
    line-height:1.4;
  }
  .lyric-all-item:hover{color:rgba(255,255,255,.85);background:rgba(255,255,255,.06)}
  .lyric-all-item.lyric-all-cur{
    color:#aef;font-weight:bold;
    background:rgba(120,200,255,.08);
  }
  .lyric-all-item.lyric-all-near{color:rgba(255,255,255,.65)}
  .la-time{font-variant-numeric:tabular-nums;font-size:11px;opacity:.5;flex-shrink:0}
  .la-text{flex:1;word-break:break-all}
  .lyric-all-cur .la-time{opacity:.8}
  .lyric-all-cur .la-text{text-shadow:0 0 8px rgba(120,200,255,.5)}

  /* ============================================================
     v3.41 移动端适配
     架构：频谱/歌词由电脑端 audio_server 采集推送，手机连电脑 IP 即可
     观看电脑正在播放音乐的可视化；本地文件模式手机也可用。
     ============================================================ */
  /* 触控优化：manipulation 消除双击缩放/点击延迟，原生 click 即可，无需 touch 补丁 */
  .btn, .seg-btn, select, .shape-badge{ touch-action: manipulation; }

  /* v3.46c 手机布局触发：竖屏窄宽 OR 横屏触屏矮高（横屏宽度常 >820px，需按高度判定） */
  @media (max-width: 820px), (pointer:coarse) and (orientation:landscape) and (max-height:520px){
    /* v3.46c 容器透明化：两组控件分别 fixed（顶部搜索行 / 右上角竖排按钮） */
    #ui{
      top:0;left:0;right:0;bottom:auto;
      max-width:none;max-height:none;padding:0;
      background:transparent;border:0;box-shadow:none;border-radius:0;
      backdrop-filter:none;-webkit-backdrop-filter:none;
      pointer-events:none;
    }
    #ui.pinned{pointer-events:none}
    #ui .row{
      position:fixed;flex-wrap:nowrap;gap:8px;padding:8px;
      background:rgba(8,8,14,.78);border:1px solid rgba(255,255,255,.10);
      border-radius:12px;
      backdrop-filter:blur(14px) saturate(160%);
      -webkit-backdrop-filter:blur(14px) saturate(160%);
      box-shadow:0 8px 24px rgba(0,0,0,.45);
      pointer-events:auto;
    }
    /* 贴最上方：搜索框 + 搜索 + 歌词版本更换（宽度按内容，排不下才横滑，无多余空白） */
    #topSearchRow{
      top:calc(10px + env(safe-area-inset-top,0px));
      left:calc(10px + env(safe-area-inset-left,0px));
      right:auto;
      max-width:calc(100vw - 20px - 134px);
      overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;
    }
    #topSearchRow::-webkit-scrollbar{display:none}
    #topSearchRow > *{flex-shrink:0}
    #topSearchRow #subsSearch{flex:0 0 auto;width:112px;min-width:0}
    /* 右上角竖排：①缩小 ②全屏 ③识别歌曲 ④设置 */
    #sideBtnRow{
      top:calc(10px + env(safe-area-inset-top,0px));
      right:calc(10px + env(safe-area-inset-right,0px));
      flex-direction:column;align-items:stretch;
    }
    #sideBtnRow .btn{width:100%;min-height:40px;padding:8px 12px;text-align:center}

    /* 手指触控目标 ≥38px */
    .btn{ min-height:38px; padding:7px 13px; }
    .seg .seg-btn{ min-height:34px; padding:5px 10px; }

    /* iOS 大坑：输入框字号 <16px 聚焦时整页自动放大 → 强制 16px */
    #subsSearch{ width:112px; font-size:16px; }

    /* 历史面板：fixed 定位由 JS 统一摆放（桌面=搜索框下方，窄屏=上方全宽），
       这里只放开宽度限制 */
    #historyPanel{ max-width:none; }

    /* 顶部被搜索行+竖排按钮占用，歌名胶囊/倒计时/状态条整体下移 */
    #nowPlaying{
      top:68px; left:10px; max-width:calc(100vw - 20px - 134px);
      font-size:13px; padding:6px 12px;
    }
    #autoLockChip{ top:102px; left:10px; max-width:calc(100vw - 20px - 134px); font-size:12px; }
    #status{ top:138px; left:10px; max-width:calc(100vw - 20px - 134px); font-size:11px; }
    #hint{ font-size:12px; top:10%; padding:8px 14px; }

    /* 设置面板：近全屏（盖住控件） */
    #settingsPanel{
      top:10px; left:10px; right:10px;
      bottom:calc(10px + env(safe-area-inset-bottom,0px));
      width:auto; max-height:none;
    }
    /* v3.46e 横屏：设置只占右侧 1/3，调律动线条时左侧 2/3 可见实时状态 */
    @media (orientation:landscape){
      #settingsPanel{
        left:auto;
        width:calc((100vw - 30px)/3);
      }
    }

    /* 歌词全列表面板：全宽、上半屏 */
    #lyricsAllPanel{
      top:10px; left:10px; right:10px; bottom:auto;
      width:auto; height:min(62vh, 520px);
    }

    /* 收起/沉浸态的「控制台」召唤按钮：右上角 */
    #showBtn{
      top:calc(10px + env(safe-area-inset-top,0px));
      right:calc(10px + env(safe-area-inset-right,0px));
      bottom:auto;
      min-height:40px;padding:8px 14px;
    }
  }

  /* 触屏设备：去掉 hover 带来的卡态（触屏没有真正的悬停） */
  @media (pointer: coarse){
    .btn:hover{ background:rgba(255,255,255,.06); }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="status"></div>

<div id="nowPlaying"><span class="np-dot"></span><span class="np-title"></span></div>
<div id="autoLockChip"><span class="alc-dot"></span><span id="autoLockChipText">自动识别 30s</span></div>

<div id="hint">点屏幕关闭提示 · 控制台在右上角 · 📌 可固定/浮动面板 · 配色随音量自动冷→暖 · 🎵 识别歌曲自动跟歌词 · 🔄 DJ混音自动跟随 · ☁ 网易云备源</div>

<!-- 右侧歌词全列表面板（手动对齐/查看） -->
<div id="lyricsAllPanel">
  <div class="lyrics-all-header">
    <span id="lyricsAllTitle" style="font-size:13px;opacity:.85">歌词列表</span>
    <button class="btn" id="lyricsAllClose" style="font-size:13px;padding:4px 10px">✕</button>
  </div>
  <div id="lyricsAllList"></div>
</div>

<!-- v3.41: 历史面板挂在 body 下（fixed），避免被工具栏滚动容器裁剪 -->
<div id="historyPanel"></div>

<!-- ============ 二级页面：顶部搜索行 + 右上角竖排按钮 ============ -->
<div id="ui" class="pinned">
  <!-- 贴最上方：搜索框 + 搜索 + 歌词版本更换 -->
  <div class="row subs-sync-row" id="topSearchRow">
    <span class="search-wrap">
      <input type="text" id="subsSearch" placeholder="搜歌名/歌词" style="width:160px" title="点击查看最近20条识别记录">
    </span>
    <button class="btn" id="searchBtn">🔍 搜索</button>
    <button class="btn" id="matchVersionBtn" style="display:none" title="歌词不对？点一下换版本；只有一个版本时按歌名重新搜索更多版本">🎯 歌词版本更换</button>
  </div>
  <!-- 右上角竖排：①缩小 ②全屏 ③识别歌曲 ④设置 -->
  <div class="row" id="sideBtnRow">
    <button class="btn" id="hideBtn" title="收起工具栏">— 缩小</button>
    <button class="btn" id="fsBtn" title="全屏 / 退出全屏">⛶ 全屏</button>
    <button class="btn" id="recogBtn" title="录15秒识别当前歌曲并自动加载歌词"><span class="recog-fill"></span><span class="recog-label"><span class="recog-note">&#x266A;&#xFE0E;</span> 识别歌曲</span></button>
    <button class="btn" id="settingsBtn" title="打开设置：音源/配色/歌词开关/自动跟随等">⚙ 设置</button>
  </div>
</div>

<button id="showBtn" class="btn">⚙ 控制台</button>

<!-- ============ 三级页面：设置面板（收拢其他全部控件） ============ -->
<div id="settingsPanel">
  <div class="set-header">
    <span>⚙ 设置</span>
    <button class="btn" id="settingsClose" style="padding:4px 11px">✕</button>
  </div>

  <div class="row">
    <span class="lab">音源 SOURCE</span>
    <div class="seg" id="sourceSeg">
      <button class="seg-btn active" data-source="system">系统音频</button>
      <button class="seg-btn" data-source="file">本地音乐</button>
      <button class="seg-btn" data-source="mic">麦克风</button>
      <button class="seg-btn" data-source="demo">演示</button>
    </div>
    <input type="file" id="fileInput" accept="audio/*">
  </div>

  <div class="row">
    <span class="lab">形态 SHAPE</span>
    <span class="shape-badge">镜像波形 · 三频律动</span>
  </div>

  <div class="row">
    <span class="lab">歌词版本</span>
    <select id="versionSelect" style="display:none;max-width:220px" title="自行选择歌词版本"></select>
  </div>

  <div class="row">
    <span class="lab">歌词显示</span>
    <button class="btn active" id="lyricsOnOffBtn" title="关闭后歌词不再显示（历史记录保留）">🎤 歌词 开</button>
  </div>

  <div class="row">
    <span class="lab">自动跟随</span>
    <button class="btn active" id="autoLockBtn" title="歌词放完后等30秒自动识别下一首；连续失败自动关闭">🔄 自动跟随</button>
    <span id="autoLockCountdown" style="font-size:11px;opacity:.6"></span>
  </div>

  <div class="row">
    <span class="lab">配色 COLOR</span>
    <select id="color">
      <option value="rainbow" selected>自动·幻彩</option>
      <option value="neon">霓虹紫蓝</option>
      <option value="fire">烈焰红橙</option>
      <option value="aurora">极光青绿</option>
      <option value="gold">迷幻金紫</option>
    </select>
  </div>

  <div class="row">
    <span class="lab">灵敏度</span>
    <input type="range" id="sens" min="0.5" max="3" step="0.05" value="1.4">
    <span class="v" id="sensV">1.40</span>
    <span class="lab">平滑</span>
    <input type="range" id="smooth" min="0" max="0.95" step="0.01" value="0.42">
    <span class="v" id="smoothV">0.42</span>
  </div>

  <div class="row">
    <span class="lab">辉光</span>
    <input type="range" id="glow" min="0" max="3" step="0.05" value="1.4">
    <span class="v" id="glowV">1.40</span>
    <span class="lab">线宽</span>
    <input type="range" id="lw" min="0.5" max="4" step="0.1" value="1.6">
    <span class="v" id="lwV">1.60</span>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
